    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
            },
            colors: {
              dale: {
                blue: '#002B49',  // Azul Principal
                green: '#008F45', // Verde Secundário
                light: '#E6F4EA', // Verde Claro
                gold: '#FFD700',  // Dourado/Amarelo
              },
              sand: {
                50: '#F9F9F7',
                100: '#F0F0EB',
                200: '#E2E2D9',
              },
              // Cores da referência visual aprovada (topo e hero) – guia de ajustes 02/10/2026
              ref: {
                ink: '#0B1430',
                text: '#1D264E',
                muted: '#6B6C80',
                line: '#E6E3EC',
                canvas: '#FAF7F4',
                blue: '#0561B8',
                'blue-dark': '#044C91',
                'blue-light': '#E0EDF5',
                'blue-pin': '#0880F8',
                whats: '#03A62D',
                'whats-dark': '#028F26',
                leaf: '#D8E8CB',
                lilac: '#E7EAFE',
                'lilac-border': '#C9CFF9',
                'lilac-text': '#4352C9',
                star: '#FCC13C',
              },
              // Cores do site do DALE+ (seção DALE+ Benefícios)
              dm: {
                navy: '#07263B',
                blue: '#036EAD',
                sky: '#5DB6F2',
                yellow: '#F9C638',
              }
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'marquee': 'marquee 40s linear infinite',
              'marquee-slow': 'marquee 60s linear infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'border-flow': 'borderFlow 3s linear infinite',
              'ring': 'ring 3s infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              borderFlow: {
                '0%': { backgroundPosition: '0% 50%' },
                '100%': { backgroundPosition: '200% 50%' },
              },
              ring: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '5%, 15%, 25%': { transform: 'rotate(10deg)' },
                '10%, 20%, 30%': { transform: 'rotate(-10deg)' },
                '35%': { transform: 'rotate(0deg)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      body { background-color: #F9F9F7; }

      /* Ajustes do site (02/10/2026): altura do topo fixo, usada para afastar o conteúdo */
      :root { --header-h: 130px; }
      @media (min-width: 1024px) { :root { --header-h: 97px; } }

      /* Hero: foto com degradê nas bordas, para fundir com o fundo da seção */
      .hero-photo {
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 32%, #000 94%, transparent 100%), linear-gradient(to bottom, transparent 0%, #000 6%, #000 66%, transparent 97%);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(to right, transparent 0%, #000 32%, #000 94%, transparent 100%), linear-gradient(to bottom, transparent 0%, #000 6%, #000 66%, transparent 97%);
        mask-composite: intersect;
      }
      @media (min-width: 640px) {
        .hero-photo {
          -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 14%), linear-gradient(to bottom, #000 80%, transparent 100%);
          -webkit-mask-composite: source-in;
          mask-image: linear-gradient(to right, transparent 0%, #000 14%), linear-gradient(to bottom, #000 80%, transparent 100%);
          mask-composite: intersect;
        }
      }
    </style>
